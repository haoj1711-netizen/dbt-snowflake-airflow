<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1500" viewBox="0 0 2200 1500" role="img" aria-labelledby="title desc">
  <title id="title">dbt, Snowflake, Airflow, and Astronomer Cosmos project flowchart</title>
  <desc id="desc">Detailed architecture and data lineage from an Astro Runtime and Airflow Cosmos DAG through Snowflake TPCH staging, intermediate, fact models, and dbt tests.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#475569"/></marker>
    <marker id="arrowGap" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#7c3aed"/></marker>
    <style>
      .section{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:24;filter:url(#shadow)}.section-title{font:700 24px 'Segoe UI',Arial,sans-serif;fill:#334155}
      .node{stroke-width:2;rx:16;filter:url(#shadow)}.source{fill:#eef2ff;stroke:#4f46e5}.airflow{fill:#eff6ff;stroke:#2563eb}.dbt{fill:#fff7ed;stroke:#f97316}.snow{fill:#ecfeff;stroke:#0891b2}.test{fill:#fdf4ff;stroke:#c026d3}.config{fill:#f8fafc;stroke:#64748b;stroke-dasharray:8 6}
      .h{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.t{font:15px 'Segoe UI',Arial,sans-serif;fill:#334155}.small{font:13px 'Segoe UI',Arial,sans-serif;fill:#475569}.label{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#475569}
      .arrow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrowGap)}
    </style>
  </defs>
  <rect width="2200" height="1500" fill="url(#bg)"/>
  <text x="70" y="66" style="font:800 36px 'Segoe UI',Arial,sans-serif;fill:#0f172a">dbt + Snowflake + Airflow — Project Flow</text>
  <text x="70" y="101" style="font:17px 'Segoe UI',Arial,sans-serif;fill:#64748b">Repository-derived architecture and data lineage • dashed purple = manual/external configuration</text>

  <rect class="section" x="50" y="135" width="2100" height="270"/>
  <text class="section-title" x="80" y="177">1 · Development, packaging, and deployed project selection</text>
  <rect class="node source" x="90" y="220" width="320" height="120"/><text class="h" x="250" y="259" text-anchor="middle">data_pipeline/</text><text class="t" x="250" y="287" text-anchor="middle">Standalone dbt source copy</text><text class="small" x="250" y="315" text-anchor="middle">use for local dbt CLI development</text>
  <rect class="node source" x="520" y="205" width="390" height="150"/><text class="h" x="715" y="244" text-anchor="middle">dbt-dag/dags/dbt/data_pipeline/</text><text class="t" x="715" y="276" text-anchor="middle">Deployment copy executed by Airflow</text><text class="small" x="715" y="305" text-anchor="middle">currently byte-for-byte identical</text><text class="small" x="715" y="330" text-anchor="middle">can drift without a sync/build step</text>
  <rect class="node airflow" x="1050" y="205" width="350" height="150"/><text class="h" x="1225" y="244" text-anchor="middle">Astro Runtime 3.2-4</text><text class="t" x="1225" y="276" text-anchor="middle">Apache Airflow</text><text class="small" x="1225" y="305" text-anchor="middle">Astronomer Cosmos</text><text class="small" x="1225" y="330" text-anchor="middle">Snowflake provider</text>
  <rect class="node dbt" x="1540" y="220" width="300" height="120"/><text class="h" x="1690" y="259" text-anchor="middle">dbt_venv</text><text class="t" x="1690" y="287" text-anchor="middle">dbt-snowflake</text><text class="small" x="1690" y="315" text-anchor="middle">AIRFLOW_HOME/dbt_venv/bin/dbt</text>
  <rect class="node config" x="1900" y="215" width="205" height="130"/><text class="h" x="2002" y="254" text-anchor="middle">Secrets</text><text class="small" x="2002" y="284" text-anchor="middle">snowflake_conn</text><text class="small" x="2002" y="309" text-anchor="middle">or secrets backend</text><text class="small" x="2002" y="330" text-anchor="middle">not committed</text>
  <path class="dash" d="M410 280 H520"/><text class="label" x="465" y="262" text-anchor="middle">manual sync</text>
  <path class="arrow" d="M910 280 H1050"/><text class="label" x="980" y="262" text-anchor="middle">image context</text>
  <path class="arrow" d="M1400 280 H1540"/><text class="label" x="1470" y="262" text-anchor="middle">Docker build</text>

  <rect class="section" x="50" y="440" width="2100" height="295"/>
  <text class="section-title" x="80" y="482">2 · Daily Airflow orchestration through Astronomer Cosmos</text>
  <rect class="node airflow" x="100" y="545" width="250" height="120"/><text class="h" x="225" y="583" text-anchor="middle">@daily schedule</text><text class="t" x="225" y="612" text-anchor="middle">start 2023-05-17</text><text class="small" x="225" y="638" text-anchor="middle">catchup = false</text>
  <rect class="node airflow" x="480" y="520" width="350" height="170"/><text class="h" x="655" y="560" text-anchor="middle">Airflow dbt_dag</text><text class="t" x="655" y="590" text-anchor="middle">Cosmos DbtDag</text><text class="small" x="655" y="620" text-anchor="middle">profile: data_pipeline / target: dev</text><text class="small" x="655" y="645" text-anchor="middle">project path: embedded deployment copy</text><text class="small" x="655" y="670" text-anchor="middle">connection: snowflake_conn</text>
  <rect class="node dbt" x="970" y="530" width="320" height="150"/><text class="h" x="1130" y="570" text-anchor="middle">Dependency installation</text><text class="t" x="1130" y="600" text-anchor="middle">install_deps = true</text><text class="small" x="1130" y="630" text-anchor="middle">dbt_utils 1.1.1</text><text class="small" x="1130" y="655" text-anchor="middle">requires package-network access</text>
  <rect class="node dbt" x="1430" y="520" width="360" height="170"/><text class="h" x="1610" y="560" text-anchor="middle">Cosmos task graph</text><text class="t" x="1610" y="590" text-anchor="middle">Parse dbt refs and sources</text><text class="small" x="1610" y="620" text-anchor="middle">Run models in dependency order</text><text class="small" x="1610" y="645" text-anchor="middle">Run generic and singular tests</text><text class="small" x="1610" y="670" text-anchor="middle">using dbt executable in virtualenv</text>
  <rect class="node config" x="1880" y="520" width="230" height="170"/><text class="h" x="1995" y="558" text-anchor="middle">Snowflake profile</text><text class="small" x="1995" y="588" text-anchor="middle">DBT_DB</text><text class="small" x="1995" y="612" text-anchor="middle">DBT_SCHEMA</text><text class="small" x="1995" y="636" text-anchor="middle">DBT_WH</text><text class="small" x="1995" y="660" text-anchor="middle">account/user/password/role</text>
  <path class="arrow" d="M350 605 H480"/><path class="arrow" d="M830 605 H970"/><path class="arrow" d="M1290 605 H1430"/><path class="dash" d="M1900 280 C1850 280 1850 605 1790 605"/><path class="dash" d="M1880 605 H1790"/>
  <path class="arrow" d="M715 355 V520"/><text class="label" x="730" y="438">project files</text><path class="arrow" d="M1690 340 V430 H1610 V520"/><text class="label" x="1695" y="420">dbt CLI</text>

  <rect class="section" x="50" y="770" width="2100" height="655"/>
  <text class="section-title" x="80" y="812">3 · Snowflake lineage, materializations, and quality gates</text>
  <rect class="node snow" x="85" y="885" width="310" height="120"/><text class="h" x="240" y="925" text-anchor="middle">TPCH_SF1.ORDERS</text><text class="t" x="240" y="954" text-anchor="middle">SNOWFLAKE_SAMPLE_DATA</text><text class="small" x="240" y="980" text-anchor="middle">shared read-only source</text>
  <rect class="node snow" x="85" y="1115" width="310" height="120"/><text class="h" x="240" y="1155" text-anchor="middle">TPCH_SF1.LINEITEM</text><text class="t" x="240" y="1184" text-anchor="middle">SNOWFLAKE_SAMPLE_DATA</text><text class="small" x="240" y="1210" text-anchor="middle">shared read-only source</text>
  <rect class="node dbt" x="505" y="870" width="310" height="145"/><text class="h" x="660" y="910" text-anchor="middle">stg_tpch_orders</text><text class="t" x="660" y="940" text-anchor="middle">VIEW</text><text class="small" x="660" y="968" text-anchor="middle">renamed order/customer keys</text><text class="small" x="660" y="992" text-anchor="middle">status, price, date</text>
  <rect class="node dbt" x="505" y="1095" width="310" height="160"/><text class="h" x="660" y="1135" text-anchor="middle">stg_tpch_line_items</text><text class="t" x="660" y="1165" text-anchor="middle">VIEW</text><text class="small" x="660" y="1193" text-anchor="middle">dbt_utils surrogate item key</text><text class="small" x="660" y="1217" text-anchor="middle">quantity, price, discount, tax</text><text class="small" x="660" y="1241" text-anchor="middle">order relationship</text>
  <rect class="node dbt" x="930" y="985" width="330" height="180"/><text class="h" x="1095" y="1025" text-anchor="middle">int_order_items</text><text class="t" x="1095" y="1055" text-anchor="middle">TABLE</text><text class="small" x="1095" y="1085" text-anchor="middle">join order + line item</text><text class="small" x="1095" y="1110" text-anchor="middle">discounted_amount macro</text><text class="small" x="1095" y="1135" text-anchor="middle">produces negative discount amount</text>
  <rect class="node dbt" x="1380" y="985" width="330" height="180"/><text class="h" x="1545" y="1025" text-anchor="middle">int_order_items_summary</text><text class="t" x="1545" y="1055" text-anchor="middle">TABLE</text><text class="small" x="1545" y="1085" text-anchor="middle">group by order_key</text><text class="small" x="1545" y="1110" text-anchor="middle">gross item sales</text><text class="small" x="1545" y="1135" text-anchor="middle">summed discount amount</text>
  <rect class="node dbt" x="1800" y="965" width="285" height="205"/><text class="h" x="1942" y="1005" text-anchor="middle">fct_orders</text><text class="t" x="1942" y="1035" text-anchor="middle">TABLE</text><text class="small" x="1942" y="1065" text-anchor="middle">order attributes</text><text class="small" x="1942" y="1090" text-anchor="middle">gross item sales</text><text class="small" x="1942" y="1115" text-anchor="middle">discount amount</text><text class="small" x="1942" y="1145" text-anchor="middle">final analytical fact</text>
  <path class="arrow" d="M395 945 H505"/><path class="arrow" d="M395 1175 H505"/><path class="arrow" d="M815 942 C870 942 875 1045 930 1045"/><path class="arrow" d="M815 1175 C870 1175 875 1105 930 1105"/><path class="arrow" d="M1260 1075 H1380"/><path class="arrow" d="M1710 1075 H1800"/><path class="arrow" d="M815 920 C1390 820 1740 900 1800 1005"/>
  <path class="arrow" d="M1610 690 V755 H660 V870"/><text class="label" x="1140" y="747" text-anchor="middle">execute dbt graph</text>

  <rect class="node test" x="110" y="1300" width="500" height="90"/><text class="h" x="360" y="1335" text-anchor="middle">Source tests</text><text class="small" x="360" y="1362" text-anchor="middle">order key unique/not-null • lineitem → orders relationship</text>
  <rect class="node test" x="725" y="1285" width="620" height="115"/><text class="h" x="1035" y="1322" text-anchor="middle">Fact generic tests</text><text class="small" x="1035" y="1350" text-anchor="middle">key unique/not-null • order relationship (warning) • status ∈ P/O/F</text><text class="small" x="1035" y="1375" text-anchor="middle">configured in models/marts/generic_tests.yaml</text>
  <rect class="node test" x="1470" y="1285" width="615" height="115"/><text class="h" x="1777" y="1322" text-anchor="middle">Fact singular tests</text><text class="small" x="1777" y="1350" text-anchor="middle">discount amount must not be positive</text><text class="small" x="1777" y="1375" text-anchor="middle">order date must be 1990-01-01 through today</text>
  <path class="arrow" d="M240 1235 V1300"/><path class="arrow" d="M1942 1170 C1942 1235 1035 1225 1035 1285"/><path class="arrow" d="M1942 1170 V1245 H1777 V1285"/>
  <rect class="node snow" x="1695" y="825" width="390" height="100"/><text class="h" x="1890" y="865" text-anchor="middle">Target: DBT_DB.DBT_SCHEMA</text><text class="small" x="1890" y="893" text-anchor="middle">models execute on DBT_WH with assigned role</text>
  <path class="dash" d="M1995 690 V825"/>

  <rect x="65" y="1443" width="2070" height="38" rx="12" fill="#f8fafc" stroke="#94a3b8"/><text class="small" x="1100" y="1468" text-anchor="middle">Separate from this lineage: example_astronauts DAG calls Open Notify, falls back to hard-coded data, then dynamically maps one print task per astronaut.</text>
</svg>
